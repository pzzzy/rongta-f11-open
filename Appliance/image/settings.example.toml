# F11 first-boot settings template
#
# Copy this file to the mounted FAT boot partition as f11-settings.toml.
# Uncomment only the settings you intend to apply. Never distribute a populated
# copy: Wi-Fi passwords and SSH keys are private. The appliance imports this file
# once during first boot and deletes it from bootfs.

# [device]
# hostname = "f11-setup"
# country = "US"
# timezone = "America/New_York"
# locale = "en_US.UTF-8"

# [wifi]
# ssid = "home-network"
# password = "replace-with-private-password"
# hidden = false

# [access]
# enable_ssh = false
# ssh_authorized_key = "ssh-ed25519 replace-with-public-key-only"

# [setup]
# disable_ap_after_connect = false
